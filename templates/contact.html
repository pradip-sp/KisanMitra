{% extends 'base.html'%}

{% block title %}
contact
{% endblock title %}
{% block body %}

{% load static %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}?v=1">

<img class="contactimg" src="../static/images/icons/contact-banner.jpeg" alt="">
<section class="contact" id="contact">

    <div class="section-title">
        <h2>Contact Us</h2>
    </div>
    {% if messages %}
    {% for message in messages %}
    <script>
        alert("{{ message }}");
    </script>
    {% endfor %}
    {% endif %}
    <form method="post" action="/contact/">
        {% csrf_token %}
        <input type="text" placeholder="Your Name" name="name">

        <input type="email" placeholder="Your Email" name="email">

        <input type="number" placeholder="Your Number" name="number">

        <textarea placeholder="Your Message" name="desc"></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

{% endblock body %}
